
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ARC - A Jornada da Bíblia</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#172b20;font-family:Arial;color:white;touch-action:none}
#game{position:fixed;inset:0}
#hud{position:fixed;top:12px;left:12px;z-index:5}
#hud h2{margin:0;color:#f6d77a}
#message{margin-top:8px;background:#172b20bb;padding:10px;border-radius:8px}
#joy{position:fixed;bottom:28px;left:25px;width:135px;height:135px;border-radius:50%;background:#ffffff30;border:3px solid #ffffff80;z-index:10;touch-action:none}
#stick{position:absolute;width:58px;height:58px;left:35px;top:35px;border-radius:50%;background:#f6d77add;border:3px solid white;pointer-events:none}
#buttons{position:fixed;bottom:30px;right:18px;display:flex;flex-direction:column;gap:12px;z-index:10}
.action{width:70px;height:60px;border-radius:18px;border:2px solid white;background:#294b32dd;color:white;font-weight:bold;font-size:13px;touch-action:none}
#run{background:#9b7133dd}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<h2>ARC - A Jornada da Bíblia</h2>
<div id="message">Explore o Jardim do Éden!</div>
</div>
<div id="joy"><div id="stick"></div></div>
<div id="buttons">
<button class="action" id="jump">PULAR</button>
<button class="action" id="run">CORRER</button>
<button class="action" id="interact">AÇÃO</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc9e5);
scene.fog = new THREE.Fog(0x9bc9e5,35,100);

const camera = new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,200
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdaf1ff,0x526b35,2));

const sun = new THREE.DirectionalLight(0xffedc5,2.5);
sun.position.set(20,35,15);
sun.castShadow=true;
scene.add(sun);

const ground = new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshStandardMaterial({color:0x638b43})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function box(w,h,d,color,x,y,z){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color})
);
m.position.set(x,y,z);
m.castShadow=true;
scene.add(m);
return m;
}

function tree(x,z){
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.4,3,8),
new THREE.MeshStandardMaterial({color:0x79502d})
);
trunk.position.set(x,1.5,z);
trunk.castShadow=true;
scene.add(trunk);

const leaves=new THREE.Mesh(
new THREE.SphereGeometry(1.7,10,9),
new THREE.MeshStandardMaterial({color:0x32743a})
);
leaves.position.set(x,3.6,z);
leaves.scale.y=1.2;
leaves.castShadow=true;
scene.add(leaves);
}

for(let i=0;i<65;i++){
let x=(Math.random()-.5)*85;
let z=(Math.random()-.5)*85;
if(Math.abs(x)>5||Math.abs(z)>5)tree(x,z);
}

// ===== MELHORIAS DO JARDIM DO EDEN =====

// Montanhas ao fundo
const hillMaterial = new THREE.MeshStandardMaterial({
  color: 0x526f45,
  roughness: 1
});

for(let i=0;i<9;i++){
  const hill = new THREE.Mesh(
    new THREE.SphereGeometry(1,16,12),
    hillMaterial
  );
  hill.scale.set(
    9+Math.random()*8,
    5+Math.random()*5,
    7
  );
  hill.position.set(
    (i-4)*19,
    2,
    -48-Math.random()*8
  );
  scene.add(hill);
}

// Pedras pelo jardim
const rockMaterial = new THREE.MeshStandardMaterial({
  color: 0x77796d,
  roughness: 1
});

for(let i=0;i<35;i++){
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(
      .35+Math.random()*.7,0
    ),
    rockMaterial
  );
  rock.position.set(
    (Math.random()-.5)*75,
    .25,
    (Math.random()-.5)*75
  );
  rock.scale.y=.6;
  rock.rotation.set(
    Math.random(),Math.random(),Math.random()
  );
  scene.add(rock);
}

// Arbustos
for(let i=0;i<45;i++){
  const bush = new THREE.Mesh(
    new THREE.SphereGeometry(1,10,8),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(
        .27+Math.random()*.06,
        .55,
        .25+Math.random()*.12
      )
    })
  );
  bush.scale.set(
    .7+Math.random(),
    .5+Math.random()*.4,
    .7+Math.random()
  );
  bush.position.set(
    (Math.random()-.5)*75,
    .45,
    (Math.random()-.5)*75
  );
  scene.add(bush);
}

// Flores coloridas
const flowerColors=[0xffd166,0xff8fab,0xffffff,0xbca0dc];

for(let i=0;i<100;i++){
  const flower = new THREE.Group();

  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(.025,.035,.35,6),
    new THREE.MeshStandardMaterial({color:0x286b32})
  );
  stem.position.y=.17;
  flower.add(stem);

  const petal = new THREE.Mesh(
    new THREE.SphereGeometry(.12,8,8),
    new THREE.MeshStandardMaterial({
      color:flowerColors[i%flowerColors.length]
    })
  );
  petal.position.y=.38;
  petal.scale.set(1,.65,1);
  flower.add(petal);

  flower.position.set(
    (Math.random()-.5)*65,
    0,
    (Math.random()-.5)*65
  );
  scene.add(flower);
}

// Caminho de terra pelo jardim
const pathCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-5,.045,25),
  new THREE.Vector3(-3,.045,12),
  new THREE.Vector3(2,.045,0),
  new THREE.Vector3(-2,.045,-14),
  new THREE.Vector3(4,.045,-28),
  new THREE.Vector3(0,.045,-42)
]);

const path = new THREE.Mesh(
  new THREE.TubeGeometry(pathCurve,80,2.1,8,false),
  new THREE.MeshStandardMaterial({
    color:0xb69a68,
    roughness:1
  })
);
scene.add(path);

// ===== FIM DAS MELHORIAS =====

  // Rio
const river=new THREE.Mesh(
new THREE.PlaneGeometry(8,90),
new THREE.MeshStandardMaterial({
color:0x4ba9c9,roughness:.25,metalness:.1
})
);
river.rotation.x=-Math.PI/2;
river.position.set(13,.025,0);
scene.add(river);

// Personagem
const player=new THREE.Group();
scene.add(player);

const skin=new THREE.MeshStandardMaterial({color:0xc68d62});
const clothes=new THREE.MeshStandardMaterial({color:0xeee0bd});
const dark=new THREE.MeshStandardMaterial({color:0x493529});

function part(geo,mat,x,y,z){
const m=new THREE.Mesh(geo,mat);
m.position.set(x,y,z);
m.castShadow=true;
player.add(m);
return m;
}

part(new THREE.CylinderGeometry(.24,.28,.8,12),clothes,0,1.15,0);
part(new THREE.SphereGeometry(.27,16,16),skin,0,1.8,0);
part(new THREE.SphereGeometry(.28,12,12),dark,0,1.96,0);

const leftLeg=part(new THREE.BoxGeometry(.16,.65,.18),dark,-.13,.45,0);
const rightLeg=part(new THREE.BoxGeometry(.16,.65,.18),dark,.13,.45,0);
const leftArm=part(new THREE.BoxGeometry(.14,.65,.14),skin,-.34,1.2,0);
const rightArm=part(new THREE.BoxGeometry(.14,.65,.14),skin,.34,1.2,0);

player.position.set(0,0,0);

let joyX=0,joyY=0;
let running=false,jumping=false,velocityY=0;
let walkTime=0;

const joy=document.getElementById('joy');
const stick=document.getElementById('stick');

joy.addEventListener('pointerdown',e=>{
joy.setPointerCapture(e.pointerId);
moveJoy(e);
});
joy.addEventListener('pointermove',e=>{
if(e.buttons)moveJoy(e);
});
function moveJoy(e){
const r=joy.getBoundingClientRect();
let x=e.clientX-(r.left+r.width/2);
let y=e.clientY-(r.top+r.height/2);
const max=48;
const len=Math.hypot(x,y);
if(len>max){x=x/len*max;y=y/len*max;}
joyX=x/max;
joyY=y/max;
stick.style.transform=`translate(${x}px,${y}px)`;
}
function releaseJoy(){
joyX=0;joyY=0;
stick.style.transform='translate(0,0)';
}
joy.addEventListener('pointerup',releaseJoy);
joy.addEventListener('pointercancel',releaseJoy);

document.getElementById('run').addEventListener('pointerdown',()=>{
running=true;
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
document.getElementById('run').addEventListener(ev,()=>running=false);
});

document.getElementById('jump').addEventListener('pointerdown',()=>{
if(!jumping){velocityY=7;jumping=true;}
});

document.getElementById('interact').addEventListener('click',()=>{
document.getElementById('message').textContent=
'Você está explorando o Jardim do Éden!';
});

const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.04);

let speed=running?8:4;
let mx=-joyX;
let mz=-joyY;
if(Math.abs(mx)+Math.abs(mz)>.1){
const direction=new THREE.Vector3(mx,0,mz).normalize();
player.position.x+=direction.x*speed*dt;
player.position.z+=direction.z*speed*dt;
player.rotation.y=Math.atan2(direction.x,direction.z);
walkTime+=dt*(running?13:8);
leftLeg.rotation.x=Math.sin(walkTime)*.65;
rightLeg.rotation.x=-Math.sin(walkTime)*.65;
leftArm.rotation.x=-Math.sin(walkTime)*.45;
rightArm.rotation.x=Math.sin(walkTime)*.45;
}else{
leftLeg.rotation.x=0;
rightLeg.rotation.x=0;
leftArm.rotation.x=0;
rightArm.rotation.x=0;
}

player.position.y+=velocityY*dt;
velocityY-=18*dt;
if(player.position.y<0){
player.position.y=0;
velocityY=0;
jumping=false;
}

player.position.x=THREE.MathUtils.clamp(player.position.x,-45,45);
player.position.z=THREE.MathUtils.clamp(player.position.z,-45,45);

const target=new THREE.Vector3(
player.position.x,
player.position.y+2,
player.position.z
);
const camPos=new THREE.Vector3(
player.position.x,
player.position.y+6,
player.position.z-10
);
camera.position.lerp(camPos,1-Math.pow(.001,dt));
camera.lookAt(target);

renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
